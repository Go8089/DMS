spring:
  application:
    name: backend
  
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true 

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
