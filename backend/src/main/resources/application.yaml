spring:
  application:
    name: backend
  
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true 

jwt:
  secret: ${JWT_SECRET}

server:
  port: 8080

admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
